<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍費用查詢系統 / Tra cứu phí KTX</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 700px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .tab-buttons {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #ddd;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #007bff;
      border-bottom: 3px solid #007bff;
    }
    .search-box {
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    button.submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button.submit-btn:hover {
      background-color: #0056b3;
    }
    .result-card {
      display: none;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 20px;
      background-color: #fafafa;
    }
    .user-info {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #1d2129;
      border-bottom: 2px solid #007bff;
      padding-bottom: 8px;
    }
    .item-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }
    .item-table th, .item-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .item-table th {
      background-color: #f0f2f5;
      color: #4b4f56;
    }
    .amount {
      text-align: right;
    }
    .discount {
      color: #d9534f;
      font-weight: bold;
    }
    .total-row {
      font-size: 18px;
      font-weight: bold;
      text-align: right;
      color: #007bff;
      padding-top: 10px;
      border-top: 2px solid #ccc;
    }
    .error-msg {
      color: #d9534f;
      text-align: center;
      display: none;
      margin-top: 15px;
      font-weight: bold;
    }
    .admin-section {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>宿舍費用查詢系統<br><span style="font-size: 16px; font-weight: normal; color: #666;">Tra cứu chi tiết phí ký túc xá</span></h2>
  
  <!-- 分頁切換 -->
  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('user')">個人查詢 / Tra cứu</button>
    <button class="tab-btn" onclick="switchTab('admin')">管理員登入 / Quản lý</button>
  </div>

  <!-- 個人查詢區塊 -->
  <div id="userTab">
    <div class="search-box">
      <label for="arcInput">居留證號 / 工號 / 姓名:</label>
      <input type="text" id="arcInput" value="" placeholder="請輸入居留證號、工號或姓名" onkeypress="handleKeyPress(event, 'user')">
      <button class="submit-btn" onclick="searchData()">查詢 / Tra cứu</button>
    </div>

    <div id="errorMsg" class="error-msg">查無資料，請確認輸入內容是否正確。<br>Không tìm thấy dữ liệu.</div>

    <div id="resultCard" class="result-card">
      <div id="userInfo" class="user-info"></div>
      <table class="item-table">
        <thead>
          <tr>
            <th>日期 (Ngày)</th>
            <th>項目 (Hạng mục)</th>
            <th class="amount">金額 (Số tiền)</th>
          </tr>
        </thead>
        <tbody id="itemBody"></tbody>
      </table>
      <div id="totalAmount" class="total-row"></div>
    </div>
  </div>

  <!-- 管理員登入區塊 -->
  <div id="adminTab" class="admin-section">
    <div class="search-box">
      <label for="adminPwd">管理員密碼 / Mật khẩu quản lý:</label>
      <input type="password" id="adminPwd" placeholder="請輸入管理員密碼" onkeypress="handleKeyPress(event, 'admin')">
      <button class="submit-btn" onclick="adminLogin()">登入 / Đăng nhập</button>
    </div>

    <div id="adminError" class="error-msg">密碼錯誤！請重新輸入。</div>

    <div id="adminResult" class="result-card">
      <div class="user-info">所有人員總表 (所有數據均精確加總)</div>
      <table class="item-table">
        <thead>
          <tr>
            <th>工號</th>
            <th>姓名</th>
            <th class="amount">本期應繳總金額</th>
          </tr>
        </thead>
        <tbody id="adminBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
// 管理員預設密碼（可以自行修改）
const ADMIN_PASSWORD = "admin123";

// 費用資料庫 (已修正：阮德合與蘇氏蓮補上-500折抵，所有項目加總絕對精確)
const monthlyData = {
  "2026-08": {
    "6EB001": {
      arc: "6EB001",
      name: "武文雄",
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/05", name: "冷氣水電費", amount: 126 }
      ]
    },
    "6EB009": {
      arc: "6EB009",
      name: "阮決勝",
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/05", name: "水電費", amount: 455 }
      ]
    },
    "6EB023": {
      arc: "6EB023",
      name: "阮德合",
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/01", name: "宿舍優惠折抵", amount: -500 },
        { date: "08/05", name: "水電費", amount: 320 }
      ]
    },
    "6EB024": {
      arc: "6EB024",
      name: "蘇氏蓮",
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/01", name: "宿舍優惠折抵", amount: -500 },
        { date: "08/05", name: "水電費", amount: 480 }
      ]
    },
    "6EB064": {
      arc: "6EB064",
      name: "阮氏翠賢",
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/01", name: "宿舍機車停車費", amount: 50 },
        { date: "08/05", name: "水電分攤", amount: 320 }
      ]
    },
    "6EB065": {
      arc: "6EB065",
      name: "賴文鐘",
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/01", name: "宿舍機車停車費", amount: 50 },
        { date: "08/01", name: "電動車充電費", amount: 300 },
        { date: "08/05", name: "冷氣水電費", amount: 360 }
      ]
    }
  }
};

// 切換頁籤
function switchTab(type) {
  const userTab = document.getElementById("userTab");
  const adminTab = document.getElementById("adminTab");
  const btns = document.querySelectorAll(".tab-btn");

  if (type === 'user') {
    userTab.style.display = "block";
    adminTab.style.display = "none";
    btns[0].classList.add("active");
    btns[1].classList.remove("active");
  } else {
    userTab.style.display = "none";
    adminTab.style.display = "block";
    btns[1].classList.add("active");
    btns[0].classList.remove("active");
  }
}

// 個人查詢邏輯
function searchData() {
  const inputVal = document.getElementById("arcInput").value.trim().toUpperCase();
  const errorMsg = document.getElementById("errorMsg");
  const resultCard = document.getElementById("resultCard");
  const userInfo = document.getElementById("userInfo");
  const itemBody = document.getElementById("itemBody");
  const totalAmount = document.getElementById("totalAmount");

  errorMsg.style.display = "none";
  resultCard.style.display = "none";
  itemBody.innerHTML = "";

  if (!inputVal) {
    alert("請輸入查詢內容！/ Vui lòng nhập thông tin!");
    return;
  }

  const currentMonthData = monthlyData["2026-08"];
  let matchedPerson = null;

  // 比對工號、居留證號或姓名
  for (let key in currentMonthData) {
    const p = currentMonthData[key];
    if (key.toUpperCase() === inputVal || (p.arc && p.arc.toUpperCase() === inputVal) || p.name === inputVal) {
      matchedPerson = p;
      break;
    }
  }

  if (matchedPerson) {
    userInfo.textContent = `姓名 (Họ tên): ${matchedPerson.name} (${matchedPerson.arc})`;
    
    // 動態加總金額（確保百分之百準確）
    let calculatedTotal = 0;

    matchedPerson.items.forEach(item => {
      calculatedTotal += item.amount;
      
      const tr = document.createElement("tr");
      const tdDate = document.createElement("td");
      tdDate.textContent = item.date || "-";
      
      const tdName = document.createElement("td");
      tdName.textContent = item.name;
      
      const tdAmount = document.createElement("td");
      tdAmount.className = "amount";
      
      if (item.amount < 0) {
        tdAmount.classList.add("discount");
        tdAmount.textContent = `- NT$ ${Math.abs(item.amount).toLocaleString()}`;
      } else {
        tdAmount.textContent = `NT$ ${item.amount.toLocaleString()}`;
      }

      tr.appendChild(tdDate);
      tr.appendChild(tdName);
      tr.appendChild(tdAmount);
      itemBody.appendChild(tr);
    });

    totalAmount.textContent = `總計 (Tổng cộng): NT$ ${calculatedTotal.toLocaleString()}`;
    resultCard.style.display = "block";
  } else {
    errorMsg.style.display = "block";
  }
}

// 管理員登入邏輯
function adminLogin() {
  const pwd = document.getElementById("adminPwd").value.trim();
  const adminError = document.getElementById("adminError");
  const adminResult = document.getElementById("adminResult");
  const adminBody = document.getElementById("adminBody");

  adminError.style.display = "none";
  adminResult.style.display = "none";
  adminBody.innerHTML = "";

  if (pwd === ADMIN_PASSWORD) {
    const currentMonthData = monthlyData["2026-08"];
    
    for (let key in currentMonthData) {
      const person = currentMonthData[key];
      let sum = 0;
      person.items.forEach(i => sum += i.amount);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${person.arc}</td>
        <td>${person.name}</td>
        <td class="amount" style="font-weight:bold; color:#007bff;">NT$ ${sum.toLocaleString()}</td>
      `;
      adminBody.appendChild(tr);
    }
    
    adminResult.style.display = "block";
  } else {
    adminError.style.display = "block";
  }
}

function handleKeyPress(event, type) {
  if (event.key === "Enter") {
    if (type === 'user') searchData();
    if (type === 'admin') adminLogin();
  }
}
</script>

</body>
</html>
