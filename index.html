<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>伊頓宿舍費用查詢系統 / Tra cứu phí KTX Eton</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, "Microsoft JhengHei", sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background-color: #ffffff; width: 100%; max-width: 800px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-bottom: 20px; line-height: 1.4; }
    .search-box { margin-bottom: 25px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; margin-bottom: 12px; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .result-card { display: none; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; background-color: #fafafa; margin-top: 15px; }
    .user-info { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #1d2129; border-bottom: 2px solid #007bff; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .item-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; background: #fff; }
    .item-table th, .item-table td { padding: 10px; text-align: left; border: 1px solid #e9ecef; font-size: 14px; }
    .item-table th { background-color: #f0f2f5; color: #4b4f56; font-weight: bold; }
    .amount { text-align: right; font-weight: bold; }
    .total-row { font-size: 18px; font-weight: bold; text-align: right; color: #007bff; padding-top: 10px; border-top: 2px solid #007bff; margin-top: 10px; }
    .error-msg { color: #d9534f; text-align: center; display: none; margin-top: 15px; font-weight: bold; background: #f8d7da; padding: 12px; border-radius: 6px; border: 1px solid #f5c6cb; }
    .badge { font-size: 12px; padding: 3px 8px; border-radius: 4px; background: #e7f1ff; color: #004085; display: inline-block; }
    .badge-self { background: #fff3cd; color: #856404; }
  </style>
</head>
<body>

<div class="container">
  <h2>伊頓宿舍費用查詢系統<br><span style="font-size: 16px; font-weight: normal; color: #666;">Tra cứu chi tiết phí ký túc xá Eton</span></h2>
  
  <div class="search-box">
    <label for="loginInput">居留證號碼 / Số thẻ cư trú:</label>
    <input type="text" id="loginInput" placeholder="請輸入居留證號 (例如: D900254071) 或 管理員密碼" onkeypress="handleKeyPress(event)">
    <button onclick="loginOrSearch()">登入查詢 / Tra cứu</button>
  </div>

  <div id="errorMsg" class="error-msg">查無此居留證號碼，請確認後重新輸入。<br>Không tìm thấy số thẻ cư trú này.</div>

  <!-- 個人細項明細 -->
  <div id="userResult" class="result-card">
    <div id="userInfo" class="user-info"></div>
    <table class="item-table">
      <thead>
        <tr>
          <th style="width: 15%;">結帳日期<br><span style="font-weight:normal;font-size:12px;">Ngày</span></th>
          <th style="width: 35%;">費用項目<br><span style="font-weight:normal;font-size:12px;">Tên khoản phí</span></th>
          <th style="width: 25%;">越南文類別<br><span style="font-weight:normal;font-size:12px;">Tiếng Việt</span></th>
          <th style="width: 10%;">類型</th>
          <th style="width: 15%; text-align: right;">金額<br><span style="font-weight:normal;font-size:12px;">Số tiền</span></th>
        </tr>
      </thead>
      <tbody id="userItemBody"></tbody>
    </table>
    <div id="totalAmount" class="total-row"></div>
  </div>

  <!-- 管理員總表 -->
  <div id="adminResult" class="result-card">
    <div class="user-info">
      <span>【管理員模式】伊頓人員費用總表</span>
      <span style="font-size:14px; font-weight:normal; color:#666;" id="adminTotalCount"></span>
    </div>
    <table class="item-table">
      <thead>
        <tr>
          <th>工號</th>
          <th>居留證號</th>
          <th>姓名</th>
          <th>項目筆數</th>
          <th class="amount">應繳總金額</th>
        </tr>
      </thead>
      <tbody id="adminItemBody"></tbody>
    </table>
  </div>
</div>

<script>
// 1. 管理員萬用密碼
const ADMIN_PASSWORD = "ADMIN123";

// 2. 伊頓全體人員明細資料庫 (由115.08扣款明細與人員總表對應匯入)
const personList = [
  {
    "code": "6EB066", "arc": "D800382407", "name": "黃玉榮",
    "items": [
      { "date": "115/08/20", "zh": "印章", "vn": "Ｃon dấu", "amount": 50, "kind": "自收" },
      { "date": "115/08/21", "zh": "加做檢", "vn": "Kiểm tra sức khỏe đặc biệt", "amount": 500, "kind": "自收" },
      { "date": "115/08/20", "zh": "服務費第一年", "vn": "PHÍPHỤCVỤ THÁNG", "amount": 1800, "kind": "自收" },
      { "date": "115/08/20", "zh": "居留證", "vn": "PHÍLÀMTHẺCƯTRÚ", "amount": 1000, "kind": "自收" },
      { "date": "115/08/20", "zh": "居留證", "vn": "PHÍLÀMTHẺCƯTRÚ", "amount": 1000, "kind": "自收" },
      { "date": "115/08/20", "zh": "水費", "vn": "Điện nước", "amount": 150, "kind": "自收" },
      { "date": "115/08/20", "zh": "電費", "vn": "Phí điện", "amount": 150, "kind": "自收" },
      { "date": "115/08/20", "zh": "冷氣費", "vn": "Phí điều hòa", "amount": 32, "kind": "自收" },
      { "date": "115/08/20", "zh": "宿舍停車費", "vn": "Phí để xe kí túc", "amount": 100, "kind": "自收" }
    ]
  },
  {
    "code": "6EB064", "arc": "D900254071", "name": "阮氏翠賢",
    "items": [
      { "date": "115/08/20", "zh": "電動車充電費", "vn": "Phí xạc xe điện", "amount": 300, "kind": "扣款" },
      { "date": "115/08/20", "zh": "宿舍停車費", "vn": "Phí để xe kí túc", "amount": 50, "kind": "扣款" },
      { "date": "115/08/20", "zh": "電費", "vn": "Phí điện", "amount": 150, "kind": "扣款" },
      { "date": "115/07/09", "zh": "寢具日用品", "vn": "Đồ dùng hàng ngày", "amount": 2000, "kind": "扣款" },
      { "date": "115/08/01", "zh": "印章", "vn": "Ｃon dấu", "amount": 50, "kind": "扣款" },
      { "date": "115/08/21", "zh": "加做檢", "vn": "Kiểm tra sức khỏe đặc biệt", "amount": 500, "kind": "扣款" },
      { "date": "115/08/20", "zh": "水費", "vn": "Điện nước", "amount": 150, "kind": "扣款" },
      { "date": "115/08/20", "zh": "服務費第一年", "vn": "PHÍPHỤCVỤ THÁNG", "amount": 1800, "kind": "扣款" }
    ]
  },
  {
    "code": "6EB067", "arc": "D800384821", "name": "潘青河",
    "items": [
      { "date": "115/08/20", "zh": "宿舍停車費", "vn": "Phí để xe kí túc", "amount": 100, "kind": "自收" },
      { "date": "115/08/20", "zh": "電費", "vn": "Phí điện", "amount": 150, "kind": "自收" },
      { "date": "115/08/20", "zh": "冷氣費", "vn": "Phí điều hòa", "amount": 316, "kind": "自收" },
      { "date": "115/08/20", "zh": "水費", "vn": "Điện nước", "amount": 150, "kind": "自收" },
      { "date": "115/08/20", "zh": "服務費第一年", "vn": "PHÍPHỤCVỤ THÁNG", "amount": 1800, "kind": "自收" },
      { "date": "115/08/20", "zh": "體檢費", "vn": "PHÍKHÁMSỨCKHỎE", "amount": 1600, "kind": "自收" },
      { "date": "115/08/20", "zh": "居留證", "vn": "PHÍLÀMTHẺCƯTRÚ", "amount": 1000, "kind": "自收" },
      { "date": "115/08/20", "zh": "居留證", "vn": "PHÍLÀMTHẺCƯTRÚ", "amount": 1000, "kind": "自收" },
      { "date": "115/08/20", "zh": "居留證", "vn": "PHÍLÀMTHẺCƯTRÚ", "amount": 1000, "kind": "自收" },
      { "date": "115/08/21", "zh": "加做檢", "vn": "Kiểm tra sức khỏe đặc biệt", "amount": 500, "kind": "自收" },
      { "date": "115/08/20", "zh": "印章", "vn": "Ｃon dấu", "amount": 50, "kind": "自收" }
    ]
  }
  // 其餘人員明細資料可依此結構續填
];

function loginOrSearch() {
  const rawInput = document.getElementById("loginInput").value.trim();
  const inputVal = rawInput.toUpperCase();
  
  const errorMsg = document.getElementById("errorMsg");
  const userResult = document.getElementById("userResult");
  const adminResult = document.getElementById("adminResult");
  
  const userInfo = document.getElementById("userInfo");
  const userItemBody = document.getElementById("userItemBody");
  const totalAmount = document.getElementById("totalAmount");
  const adminItemBody = document.getElementById("adminItemBody");
  const adminTotalCount = document.getElementById("adminTotalCount");

  errorMsg.style.display = "none";
  userResult.style.display = "none";
  adminResult.style.display = "none";
  userItemBody.innerHTML = "";
  adminItemBody.innerHTML = "";

  if (!inputVal) {
    alert("請輸入居留證號碼或密碼！ / Vui lòng nhập số thẻ cư trú!");
    return;
  }

  // A. 管理員登入模式 (不分大小寫比對 ADMIN123)
  if (inputVal === ADMIN_PASSWORD) {
    let grandTotal = 0;
    personList.forEach(person => {
      const total = person.items.reduce((sum, item) => sum + item.amount, 0);
      grandTotal += total;
      
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${person.code || '-'}</td>
        <td>${person.arc || '無紀錄'}</td>
        <td><b>${person.name}</b></td>
        <td>${person.items.length} 筆項目</td>
        <td class="amount" style="color:#007bff;">NT$ ${total.toLocaleString()}</td>
      `;
      adminItemBody.appendChild(tr);
    });
    adminTotalCount.textContent = `(共 ${personList.length} 人，總計：NT$ ${grandTotal.toLocaleString()})`;
    adminResult.style.display = "block";
    return;
  }

  // B. 個人居留證號 / 工號 / 姓名 查詢
  const matchedPerson = personList.find(p => 
    (p.arc && p.arc.toUpperCase() === inputVal) || 
    (p.code && p.code.toUpperCase() === inputVal) ||
    (p.name && p.name === rawInput)
  );

  if (matchedPerson) {
    userInfo.innerHTML = `
      <span>${matchedPerson.name} (${matchedPerson.code || '無工號'})</span>
      <span style="font-size:14px; font-weight:normal; color:#555;">居留證號: ${matchedPerson.arc || '未登錄'}</span>
    `;
    
    let sumAmount = 0;
    matchedPerson.items.forEach(item => {
      sumAmount += item.amount;
      const tr = document.createElement("tr");
      const kindBadge = item.kind === '自收' 
        ? '<span class="badge badge-self">現場自收</span>' 
        : '<span class="badge">薪資扣款</span>';
      
      tr.innerHTML = `
        <td>${item.date}</td>
        <td><b>${item.zh}</b></td>
        <td>${item.vn}</td>
        <td>${kindBadge}</td>
        <td class="amount">NT$ ${item.amount.toLocaleString()}</td>
      `;
      userItemBody.appendChild(tr);
    });

    totalAmount.textContent = `本期應繳總計 (Tổng cộng): NT$ ${sumAmount.toLocaleString()}`;
    userResult.style.display = "block";
  } else {
    errorMsg.style.display = "block";
  }
}

function handleKeyPress(event) {
  if (event.key === "Enter") {
    loginOrSearch();
  }
}
</script>

</body>
</html>
