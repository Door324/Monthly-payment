<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍費用及扣款查詢系統 / Tra cứu費用</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 600px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .search-box {
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result-card {
      display: none;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 20px;
      background-color: #fafafa;
    }
    .user-info {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #1d2129;
      border-bottom: 2px solid #007bff;
      padding-bottom: 8px;
    }
    .item-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }
    .item-table th, .item-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .item-table th {
      background-color: #f0f2f5;
      color: #4b4f56;
    }
    .amount {
      text-align: right;
    }
    .discount {
      color: #d9534f;
      font-weight: bold;
    }
    .total-row {
      font-size: 18px;
      font-weight: bold;
      text-align: right;
      color: #007bff;
      padding-top: 10px;
      border-top: 2px solid #ccc;
    }
    .error-msg {
      color: #d9534f;
      text-align: center;
      display: none;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>宿舍費用明細查詢<br><span style="font-size: 16px; font-weight: normal; color: #666;">Tra cứu chi tiết phí ký túc xá</span></h2>
  
  <div class="search-box">
    <label for="arcInput">居留證號碼 / Số thẻ cư trú:</label>
    <input type="text" id="arcInput" value="" placeholder="請輸入居留證號碼 / Nhập số thẻ cư trú" onkeypress="handleKeyPress(event)">
    <button onclick="searchData()">查詢 / Tra cứu</button>
  </div>

  <div id="errorMsg" class="error-msg">查無此居留證資料，請確認號碼是否正確。<br>Không tìm thấy dữ liệu.</div>

  <div id="resultCard" class="result-card">
    <div id="userInfo" class="user-info"></div>
    <table class="item-table">
      <thead>
        <tr>
          <th>日期 (Ngày)</th>
          <th>項目 (Hạng mục)</th>
          <th class="amount">金額 (Số tiền)</th>
        </tr>
      </thead>
      <tbody id="itemBody">
      </tbody>
    </table>
    <div id="totalAmount" class="total-row"></div>
  </div>
</div>

<script>
// 費用資料庫
const monthlyData = {
  "2026-08": {
    "6EB001": {
      name: "武文雄",
      total: 2126,
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/05", name: "冷氣水電費", amount: 126 }
      ]
    },
    "6EB009": {
      name: "阮決勝",
      total: 2455,
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/05", name: "水電費", amount: 455 }
      ]
    },
    "6EB023": {
      name: "阮德合",
      total: 1820,
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/01", name: "宿舍優惠折抵", amount: -500 },
        { date: "08/05", name: "水電費", amount: 320 }
      ]
    },
    "6EB024": {
      name: "蘇氏蓮",
      total: 1980,
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/01", name: "宿舍優惠折抵", amount: -500 },
        { date: "08/05", name: "水電費", amount: 480 }
      ]
    },
    "6EB064": {
      name: "阮氏翠賢",
      total: 2370,
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/01", name: "宿舍機車停車費", amount: 50 },
        { date: "08/05", name: "水電分攤", amount: 320 }
      ]
    },
    "6EB065": {
      name: "賴文鐘",
      total: 2860,
      items: [
        { date: "08/01", name: "宿舍房租", amount: 2000 },
        { date: "08/01", name: "宿舍機車停車費", amount: 50 },
        { date: "08/01", name: "電動車充電費", amount: 300 },
        { date: "08/05", name: "冷氣水電費", amount: 360 }
      ]
    }
  }
};

function searchData() {
  const inputVal = document.getElementById("arcInput").value.trim().toUpperCase();
  const errorMsg = document.getElementById("errorMsg");
  const resultCard = document.getElementById("resultCard");
  const userInfo = document.getElementById("userInfo");
  const itemBody = document.getElementById("itemBody");
  const totalAmount = document.getElementById("totalAmount");

  // 重置顯示狀態
  errorMsg.style.display = "none";
  resultCard.style.display = "none";
  itemBody.innerHTML = "";

  if (!inputVal) {
    alert("請輸入居留證號碼！/ Vui lòng nhập số thẻ cư trú!");
    return;
  }

  // 搜尋對應資料（目前預設 2026-08）
  const currentMonthData = monthlyData["2026-08"];
  const personData = currentMonthData[inputVal];

  if (personData) {
    userInfo.textContent = `姓名 (Họ tên): ${personData.name} (${inputVal})`;
    
    let calculatedTotal = 0;

    personData.items.forEach(item => {
      calculatedTotal += item.amount;
      
      const tr = document.createElement("tr");
      
      const tdDate = document.createElement("td");
      tdDate.textContent = item.date || "-";
      
      const tdName = document.createElement("td");
      tdName.textContent = item.name;
      
      const tdAmount = document.createElement("td");
      tdAmount.className = "amount";
      
      if (item.amount < 0) {
        tdAmount.classList.add("discount");
        tdAmount.textContent = `- NT$ ${Math.abs(item.amount).toLocaleString()}`;
      } else {
        tdAmount.textContent = `NT$ ${item.amount.toLocaleString()}`;
      }

      tr.appendChild(tdDate);
      tr.appendChild(tdName);
      tr.appendChild(tdAmount);
      itemBody.appendChild(tr);
    });

    totalAmount.textContent = `總計 (Tổng cộng): NT$ ${calculatedTotal.toLocaleString()}`;
    resultCard.style.display = "block";
  } else {
    errorMsg.style.display = "block";
  }
}

function handleKeyPress(event) {
  if (event.key === "Enter") {
    searchData();
  }
}
</script>

</body>
</html>
