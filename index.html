<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人員管理系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .login-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .user-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        .user-name {
            font-size: 18px;
            font-weight: bold;
        }
        /* 管理員點擊專屬樣式 */
        .clickable {
            color: #007bff;
            cursor: pointer;
            text-decoration: underline;
        }
        .clickable:hover {
            color: #0056b3;
        }
        .badge {
            background-color: #e9ecef;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            color: #495057;
        }
        
        /* 彈出視窗 (Modal) 樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
        }
        .detail-row {
            margin: 10px 0;
            font-size: 16px;
            line-height: 1.5;
        }
        .detail-label {
            font-weight: bold;
            color: #555;
        }
        .close-btn {
            margin-top: 20px;
            width: 100%;
            background-color: #6c757d;
        }
        .close-btn:hover {
            background-color: #5a6268;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>人員系統登入</h2>
    
    <!-- 登入區塊 -->
    <div id="login-section" class="login-box">
        <input type="password" id="password-input" placeholder="請輸入密碼...">
        <button onclick="login()">登入</button>
    </div>

    <!-- 主內容區塊 (登入後顯示) -->
    <div id="main-section" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span id="role-badge" class="badge"></span>
            <button onclick="logout()" style="padding: 6px 12px; font-size: 14px; background-color: #dc3545;">登出</button>
        </div>
        <div id="user-list"></div>
    </div>
</div>

<!-- 詳細資料彈出視窗 -->
<div id="modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">人員詳細資料</div>
        <div id="modal-body"></div>
        <button class="close-btn" onclick="closeModal()">關閉</button>
    </div>
</div>

<script>
    // 1. 設定密碼
    const ADMIN_PASSWORD = "00000000"; // 管理員萬用密碼 (8個零)
    const USER_PASSWORD = "123";        // 一般使用者預設密碼

    // 2. 模擬人員數據資料庫
    const usersData = [
        { id: "A001", name: "張小明", department: "製造一部", room: "A棟 201", phone: "0912-345-678", status: "在職", notes: "早班，負責一號機台" },
        { id: "A002", name: "王大同", department: "品質管理", room: "B棟 105", phone: "0923-456-789", status: "在職", notes: "夜班，需協助宿舍管理" },
        { id: "A003", name: "陳美麗", department: "行政管理", room: "A棟 302", phone: "0934-567-890", status: "請假中", notes: "預計下週一返回" },
        { id: "A004", name: "李科長", department: "資材部", room: "C棟 101", phone: "0945-678-901", status: "在職", notes: "無特殊備註" }
    ];

    let isAdmin = false;

    // 3. 登入邏輯
    function login() {
        const inputPass = document.getElementById("password-input").value;

        if (inputPass === ADMIN_PASSWORD) {
            isAdmin = true;
            document.getElementById("role-badge").innerText = "目前身分：系統管理員";
            document.getElementById("role-badge").style.color = "#007bff";
            enterSystem();
        } else if (inputPass === USER_PASSWORD) {
            isAdmin = false;
            document.getElementById("role-badge").innerText = "目前身分：一般使用者";
            document.getElementById("role-badge").style.color = "#28a745";
            enterSystem();
        } else {
            alert("密碼錯誤，請重新輸入！");
        }
    }

    // 進入系統介面
    function enterSystem() {
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("main-section").classList.remove("hidden");
        renderList();
    }

    // 4. 渲染人員清單
    function renderList() {
        const listContainer = document.getElementById("user-list");
        listContainer.innerHTML = "";

        usersData.forEach((user, index) => {
            const card = document.createElement("div");
            card.className = "user-card";

            if (isAdmin) {
                // 管理員身分：名字變成藍色底線可點擊
                card.innerHTML = `
                    <span class="user-name clickable" onclick="openDetail(${index})">
                        ${user.name} 🔍
                    </span>
                    <span class="badge">${user.department}</span>
                `;
            } else {
                // 一般使用者身分：純文字無法點擊
                card.innerHTML = `
                    <span class="user-name">${user.name}</span>
                    <span class="badge">${user.department}</span>
                `;
            }
            listContainer.appendChild(card);
        });
    }

    // 5. 管理員點擊開啟詳細資料 Modal
    function openDetail(index) {
        const user = usersData[index];
        const modalBody = document.getElementById("modal-body");

        modalBody.innerHTML = `
            <div class="detail-row"><span class="detail-label">姓名：</span>${user.name}</div>
            <div class="detail-row"><span class="detail-label">工號：</span>${user.id}</div>
            <div class="detail-row"><span class="detail-label">部門：</span>${user.department}</div>
            <div class="detail-row"><span class="detail-label">宿舍房號：</span>${user.room}</div>
            <div class="detail-row"><span class="detail-label">聯絡電話：</span>${user.phone}</div>
            <div class="detail-row"><span class="detail-label">狀態：</span>${user.status}</div>
            <div class="detail-row"><span class="detail-label">備註：</span>${user.notes}</div>
        `;

        document.getElementById("modal").style.display = "flex";
    }

    // 關閉 Modal
    function closeModal() {
        document.getElementById("modal").style.display = "none";
    }

    // 6. 登出
    function logout() {
        document.getElementById("password-input").value = "";
        document.getElementById("main-section").classList.add("hidden");
        document.getElementById("login-section").classList.remove("hidden");
        isAdmin = false;
    }
</script>

</body>
</html>
