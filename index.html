<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人員資料查詢系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .logout-btn {
            background-color: #dc3545;
            margin-top: 20px;
        }
        .logout-btn:hover {
            background-color: #bd2130;
        }
        .user-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-clickable {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .admin-clickable:hover {
            background-color: #e2e6ea;
        }
        .badge {
            background-color: #17a2b8;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        /* Modal 彈出視窗樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
        }
        .modal-field {
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .close-btn {
            background-color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 登入畫面 -->
    <div id="login-section">
        <h2>系統登入</h2>
        <div class="form-group">
            <label for="password">請輸入密碼：</label>
            <input type="password" id="password" placeholder="請輸入密碼">
        </div>
        <button onclick="login()">登入</button>
    </div>

    <!-- 2. 主畫面 (登入後顯示) -->
    <div id="main-section" style="display: none;">
        <h2 id="view-title">人員清單</h2>
        <div id="content-list"></div>
        <button class="logout-btn" onclick="logout()">登出</button>
    </div>
</div>

<!-- 3. 詳細資料彈出視窗 (Modal) -->
<div id="detail-modal" class="modal">
    <div class="modal-content">
        <h3>人員詳細資料</h3>
        <div id="modal-body"></div>
        <button class="close-btn" onclick="closeModal()">關閉</button>
    </div>
</div>

<script>
    // 設定管理員萬用密碼 (8個零)
    const ADMIN_PASSWORD = "00000000";

    // 範例人員資料 (您可以自行修改或替換資料結構)
    const userData = [
        { id: "A01", name: "張小明", password: "123", department: "行政部", phone: "0912-345-678", status: "在職", note: "負責總務事項" },
        { id: "A02", name: "李大華", password: "456", department: "資訊部", phone: "0923-456-789", status: "在職", note: "系統維護人員" },
        { id: "A03", name: "王美玲", password: "789", department: "業務部", phone: "0934-567-890", status: "出差", note: "北部區域負責人" }
    ];

    let currentUserRole = ""; // "admin" 或 "user"

    function login() {
        const inputPassword = document.getElementById("password").value.trim();
        const contentList = document.getElementById("content-list");
        const viewTitle = document.getElementById("view-title");

        if (!inputPassword) {
            alert("請輸入密碼！");
            return;
        }

        // 清空密碼輸入框
        document.getElementById("password").value = "";

        // 1. 判定是否為管理員
        if (inputPassword === ADMIN_PASSWORD) {
            currentUserRole = "admin";
            viewTitle.innerText = "管理員總覽 (點擊可看細項)";
            contentList.innerHTML = "";

            // 顯示所有人員清單
            userData.forEach(user => {
                const card = document.createElement("div");
                card.className = "user-card admin-clickable";
                card.innerHTML = `
                    <div>
                        <strong>${user.name}</strong> (${user.department})
                    </div>
                    <span class="badge">查看細項</span>
                `;
                // 綁定點擊事件開啟細項 Modal
                card.onclick = () => openUserDetail(user);
                contentList.appendChild(card);
            });

            switchView(true);
            return;
        }

        // 2. 判定是否為一般使用者
        const foundUser = userData.find(u => u.password === inputPassword);
        if (foundUser) {
            currentUserRole = "user";
            viewTitle.innerText = "個人詳細資料";
            contentList.innerHTML = generateDetailHTML(foundUser);
            switchView(true);
        } else {
            alert("密碼錯誤，請重新輸入！");
        }
    }

    // 開啟細項 Modal
    function openUserDetail(user) {
        const modalBody = document.getElementById("modal-body");
        modalBody.innerHTML = generateDetailHTML(user);
        document.getElementById("detail-modal").style.display = "flex";
    }

    // 關閉細項 Modal
    function closeModal() {
        document.getElementById("detail-modal").style.display = "none";
    }

    // 生成詳細資料 HTML
    function generateDetailHTML(user) {
        return `
            <div class="modal-field"><strong>編號：</strong> ${user.id}</div>
            <div class="modal-field"><strong>姓名：</strong> ${user.name}</div>
            <div class="modal-field"><strong>部門：</strong> ${user.department}</div>
            <div class="modal-field"><strong>電話：</strong> ${user.phone}</div>
            <div class="modal-field"><strong>狀態：</strong> ${user.status}</div>
            <div class="modal-field"><strong>備註：</strong> ${user.note}</div>
        `;
    }

    // 切換登入 / 主畫面
    function switchView(isLoggedIn) {
        document.getElementById("login-section").style.display = isLoggedIn ? "none" : "block";
        document.getElementById("main-section").style.display = isLoggedIn ? "block" : "none";
    }

    // 登出
    function logout() {
        currentUserRole = "";
        switchView(false);
    }
</script>

</body>
</html>
