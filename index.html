<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>伊頓宿舍費用查詢系統 / Tra cứu phí KTX Eton</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, "Microsoft JhengHei", sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background-color: #ffffff; width: 100%; max-width: 750px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-bottom: 20px; line-height: 1.4; }
    .search-box { margin-bottom: 25px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; margin-bottom: 12px; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .result-card { display: none; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; background-color: #fafafa; }
    .user-info { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #1d2129; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
    .item-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    .item-table th, .item-table td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    .item-table th { background-color: #f0f2f5; color: #4b4f56; }
    .amount { text-align: right; }
    .total-row { font-size: 18px; font-weight: bold; text-align: right; color: #007bff; padding-top: 10px; border-top: 2px solid #ccc; }
    .error-msg { color: #d9534f; text-align: center; display: none; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>伊頓宿舍費用查詢系統<br><span style="font-size: 16px; font-weight: normal; color: #666;">Tra cứu chi tiết phí ký túc xá Eton</span></h2>
  
  <div class="search-box">
    <label for="loginInput">居留證號碼 / Số thẻ cư trú:</label>
    <input type="text" id="loginInput" placeholder="請輸入居留證號 (例如: D900254071)" onkeypress="handleKeyPress(event)">
    <button onclick="loginOrSearch()">登入查詢 / Tra cứu</button>
  </div>

  <div id="errorMsg" class="error-msg">查無此居留證號碼，請確認後重新輸入。<br>Không tìm thấy số thẻ cư trú này.</div>

  <!-- 個人明細 -->
  <div id="userResult" class="result-card">
    <div id="userInfo" class="user-info"></div>
    <table class="item-table">
      <thead>
        <tr>
          <th>工號 (Mã)</th>
          <th>姓名 (Họ tên)</th>
          <th>結帳日 (Ngày)</th>
          <th class="amount">本期金額 (Số tiền)</th>
        </tr>
      </thead>
      <tbody id="userItemBody"></tbody>
    </table>
    <div id="totalAmount" class="total-row"></div>
  </div>

  <!-- 管理員總表 -->
  <div id="adminResult" class="result-card">
    <div class="user-info">【管理員模式】伊頓人員費用總表</div>
    <table class="item-table">
      <thead>
        <tr>
          <th>工號</th>
          <th>居留證號</th>
          <th>姓名</th>
          <th class="amount">應繳金額</th>
        </tr>
      </thead>
      <tbody id="adminItemBody"></tbody>
    </table>
  </div>
</div>

function loginOrSearch() {
  const inputVal = document.getElementById("loginInput").value.trim().toUpperCase();
  const errorMsg = document.getElementById("errorMsg");
  const userResult = document.getElementById("userResult");
  const adminResult = document.getElementById("adminResult");
  
  const userInfo = document.getElementById("userInfo");
  const userItemBody = document.getElementById("userItemBody");
  const totalAmount = document.getElementById("totalAmount");
  const adminItemBody = document.getElementById("adminItemBody");

  errorMsg.style.display = "none";
  userResult.style.display = "none";
  adminResult.style.display = "none";
  userItemBody.innerHTML = "";
  adminItemBody.innerHTML = "";

  if (!inputVal) {
    alert("請輸入居留證號碼！ / Vui lòng nhập số thẻ cư trú!");
    return;
  }

  // A. 管理員萬用密碼登入
  if (inputVal === ADMIN_PASSWORD.toUpperCase()) {
    personList.forEach(person => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${person.code}</td>
        <td>${person.arc}</td>
        <td>${person.name}</td>
        <td class="amount" style="font-weight:bold; color:#007bff;">NT$ ${person.amount.toLocaleString()}</td>
      `;
      adminItemBody.appendChild(tr);
    });
    adminResult.style.display = "block";
    return;
  }

  // B. 個人居留證號查詢 (自動轉為大寫比對)
  const matchedPerson = personList.find(p => p.arc.toUpperCase() === inputVal || p.code.toUpperCase() === inputVal);

  if (matchedPerson) {
    userInfo.textContent = `居留證號: ${matchedPerson.arc} (${matchedPerson.name})`;
    
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${matchedPerson.code}</td>
      <td>${matchedPerson.name}</td>
      <td>${matchedPerson.date}</td>
      <td class="amount">NT$ ${matchedPerson.amount.toLocaleString()}</td>
    `;
    userItemBody.appendChild(tr);

    totalAmount.textContent = `本期應繳總計 (Tổng cộng): NT$ ${matchedPerson.amount.toLocaleString()}`;
    userResult.style.display = "block";
  } else {
    errorMsg.style.display = "block";
  }
}

function handleKeyPress(event) {
  if (event.key === "Enter") {
    loginOrSearch();
  }
}
</script>

</html>
